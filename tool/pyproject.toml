[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leakproof"
version = "0.0.1"
description = "Leak-resistant paper-based exam pipeline (UsS course project)"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.5", "bandit>=1.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leakproof = ["iam/matrix.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "permissions: permission matrix tests",
  "abuse: attempts to break a control",
  "simulation: statistical claims with fixed seeds",
  "e2e: whole-pipeline tests",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
