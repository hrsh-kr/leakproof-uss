<!--title: Course material-->
<!--desc: Everything the Phase I submission contains: the deliverables checklist, prototypes, research and requirements.-->
<!--js: course-->
<header class="scene hero compact"><div class="wrap">
  <h1>Course material.</h1>
  <p class="lede">Everything the Phase I submission contains, in four tabs.</p>
</div></header>
<div class="ctabs"><div class="ctabs-in">
  <div class="tabs" id="course-tabs" role="tablist" aria-label="Course material">
    <button type="button" role="tab" data-tab="checklist" aria-selected="true">Checklist</button>
    <button type="button" role="tab" data-tab="prototypes" aria-selected="false">Prototypes</button>
    <button type="button" role="tab" data-tab="research" aria-selected="false">Research</button>
    <button type="button" role="tab" data-tab="requirements" aria-selected="false">Requirements</button>
  </div>
</div></div>
<div class="tabpanel" id="tab-checklist" data-panel="checklist">{{inc:course-checklist}}</div>
<div class="tabpanel" id="tab-prototypes" data-panel="prototypes">{{inc:course-prototypes}}</div>
<div class="tabpanel" id="tab-research" data-panel="research">{{inc:course-research}}</div>
<div class="tabpanel" id="tab-requirements" data-panel="requirements">{{inc:course-requirements}}</div>
