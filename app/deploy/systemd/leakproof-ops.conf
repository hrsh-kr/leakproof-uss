# Installed as /etc/systemd/system/leakproof@.service.d/10-ops.conf (applies to every instance).
# systemd never gives up restarting after a crash; a hang is handled by lp-health (practice only).
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=3
TimeoutStopSec=10
MemoryHigh=400M
CPUQuota=300%
LimitCORE=0
